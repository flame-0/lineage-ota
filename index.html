<!DOCTYPE html>
<html>

<head>
    <title>Kenvyra Builds: alioth | Vyrine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            font-family: 'Manrope', monospace;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #242933;
        }

        .title {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ABB9CF;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .button-download {
            background-color: #2E3440;
            color: #D8DEE9;
            border: none;
            margin: 3px;
            font-size: 12px;
            font-weight: bold;
            height: 40px;
            width: 161px;
            border-radius: 4px;
            box-shadow: rgba(15, 17, 21, 0.25) 0px 3px 6px 0px;
            transition: box-shadow 400ms ease-in-out 0s, background-color 400ms ease-in-out 0s;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 13px
        }

        .button-download:hover {
            box-shadow: rgba(15, 17, 21, 0.75) 0px 3px 6px 0px;
        }

        .button-download:nth-child(2) {
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .button-download:nth-child(4) {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            margin-bottom: 10px;
        }

        .button-download:nth-child(5) {
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .button-download:last-child {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .button-download-label {
            margin-left: 5px;
        }
    </style>
</head>

<body>
    <div id="releases">
        <a class="title" href="https://github.com/vyrine/ota/releases/latest" target="_blank">Loading...</a>
    </div>

    <script>
        const releases = document.getElementById('releases');
        const apiUrl = 'https://api.github.com/repos/vyrine/ota/releases/latest';
        const variantNames = {
            'Vanilla': 'VANILLA.zip',
            'microG': 'MICROG.zip',
            'GApps': 'GAPPS.zip'
        };

        const imgNames = {
            'boot.img': 'boot.img',
            'vendor_boot.img': 'vendor_boot.img'
        };

        const svgIcons = {
            'Vanilla': `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14.1255 13H10.1255V15H14.1255V13Z" fill="#D8DEE9"/><path fill-rule="evenodd" clip-rule="evenodd" d="M8.12549 13C9.23006 13 10.1255 12.1046 10.1255 11C10.1255 9.89543 9.23006 9 8.12549 9C7.02092 9 6.12549 9.89543 6.12549 11C6.12549 12.1046 7.02092 13 8.12549 13ZM8.12549 11.5C8.40163 11.5 8.62549 11.2761 8.62549 11C8.62549 10.7239 8.40163 10.5 8.12549 10.5C7.84934 10.5 7.62549 10.7239 7.62549 11C7.62549 11.2761 7.84934 11.5 8.12549 11.5Z" fill="#D8DEE9"/><path fill-rule="evenodd" clip-rule="evenodd" d="M18.1255 11C18.1255 12.1046 17.23 13 16.1255 13C15.0209 13 14.1255 12.1046 14.1255 11C14.1255 9.89543 15.0209 9 16.1255 9C17.23 9 18.1255 9.89543 18.1255 11ZM16.6255 11C16.6255 11.2761 16.4016 11.5 16.1255 11.5C15.8493 11.5 15.6255 11.2761 15.6255 11C15.6255 10.7239 15.8493 10.5 16.1255 10.5C16.4016 10.5 16.6255 10.7239 16.6255 11Z" fill="#D8DEE9"/><path fill-rule="evenodd" clip-rule="evenodd" d="M2.74896 14.6663C3.73068 16.6421 5.76951 18 8.12549 18H16.1255C18.5655 18 20.6653 16.5435 21.603 14.4525C22.3723 13.9093 22.8747 13.0133 22.8747 12C22.8747 10.9867 22.3723 10.0907 21.603 9.54753C20.6653 7.45651 18.5655 6 16.1255 6H8.12549C5.76951 6 3.73068 7.3579 2.74896 9.33375C1.7846 9.83263 1.12549 10.8393 1.12549 12C1.12549 13.1607 1.7846 14.1674 2.74896 14.6663ZM8.12549 8H16.1255C17.5089 8 18.7283 8.70234 19.4466 9.76991C19.7228 10.4593 19.8747 11.2119 19.8747 12C19.8747 12.7881 19.7228 13.5407 19.4466 14.2301C18.7283 15.2977 17.5089 16 16.1255 16H8.12549C5.91635 16 4.12549 14.2091 4.12549 12C4.12549 9.79086 5.91635 8 8.12549 8Z" fill="#D8DEE9"/></svg>`,
            'microG': `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12C2 6.47714 6.47717 2 12 2C15.4449 2 18.4832 3.742 20.2815 6.39319L17.0039 8.68814C15.9296 7.06812 14.0895 6 12 6C8.68628 6 6 8.68628 6 12H2Z" fill="#D8DEE9"/><path d="M2 12C2 17.5229 6.47717 22 12 22C15.4449 22 18.4832 20.258 20.2815 17.6068L17.0039 15.3119C15.9296 16.9319 14.0895 18 12 18C8.68628 18 6 15.3137 6 12H2Z" fill="#D8DEE9"/></svg>`,
            'GApps': `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12C6 15.3137 8.68629 18 12 18C14.6124 18 16.8349 16.3304 17.6586 14H12V10H21.8047V14H21.8C20.8734 18.5645 16.8379 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C15.445 2 18.4831 3.742 20.2815 6.39318L17.0039 8.68815C15.9296 7.06812 14.0895 6 12 6C8.68629 6 6 8.68629 6 12Z" fill="#D8DEE9"/></svg>`,
            'boot.img': `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9ZM11 12C11 12.5523 11.4477 13 12 13C12.5523 13 13 12.5523 13 12C13 11.4477 12.5523 11 12 11C11.4477 11 11 11.4477 11 12Z" fill="currentColor" /><path d="M5 12C5 8.13401 8.13401 5 12 5V7C9.23858 7 7 9.23858 7 12H5Z" fill="currentColor" /><path d="M12 17C14.7614 17 17 14.7614 17 12H19C19 15.866 15.866 19 12 19V17Z" fill="currentColor" /><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1ZM3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12Z" fill="currentColor" /></svg>`,
            'vendor_boot.img': `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9ZM11 12C11 12.5523 11.4477 13 12 13C12.5523 13 13 12.5523 13 12C13 11.4477 12.5523 11 12 11C11.4477 11 11 11.4477 11 12Z" fill="currentColor" /><path d="M5 12C5 8.13401 8.13401 5 12 5V7C9.23858 7 7 9.23858 7 12H5Z" fill="currentColor" /><path d="M12 17C14.7614 17 17 14.7614 17 12H19C19 15.866 15.866 19 12 19V17Z" fill="currentColor" /><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1C5.92487 1 1 5.92487 1 12C1 18.0751 5.92487 23 12 23C18.0751 23 23 18.0751 23 12C23 5.92487 18.0751 1 12 1ZM3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12Z" fill="currentColor" /></svg>`
        };

        function isVariant(assetName) {
            return Object.values(variantNames).some(variant => assetName.endsWith(variant));
        }

        function isImg(assetName) {
            return assetName in imgNames;
        }

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const tagName = data.tag_name;
                const assets = data.assets;

                const titleElement = document.querySelector('.title');
                titleElement.textContent = tagName;

                const variantAssets = assets.filter(asset => isVariant(asset.name));
                const imgAssets = assets.filter(asset => isImg(asset.name));

                const sortedVariantAssets = variantAssets.sort((a, b) => {
                    const getVariantOrder = (name) => {
                        const match = name.match(/\w+\.zip$/);
                        return match ? Object.values(variantNames).indexOf(match[0]) : -1;
                    };
                    return getVariantOrder(a.name) - getVariantOrder(b.name);
                });

                const sortedAssets = [...sortedVariantAssets, ...imgAssets];

                sortedAssets.forEach(asset => {
                    const downloadUrl = asset.browser_download_url;
                    const assetName = asset.name;

                    let label;
                    if (isVariant(assetName)) {
                        label = Object.keys(variantNames).find(variant => assetName.endsWith(variantNames[variant]));
                    } else if (isImg(assetName)) {
                        label = imgNames[assetName];
                    } else {
                        label = 'Unknown';
                    }

                    const downloadButton = document.createElement('button');
                    downloadButton.classList.add('button-download');

                    downloadButton.innerHTML = svgIcons[label];

                    const buttonLabel = document.createElement('span');
                    buttonLabel.classList.add('button-download-label');
                    buttonLabel.textContent = label;
                    downloadButton.appendChild(buttonLabel);

                    downloadButton.addEventListener('click', function () {
                        const clickedVariant = downloadButton.dataset.variant;
                        window.open(downloadUrl, '_blank');
                    });

                    // Append the button to the list
                    releases.appendChild(downloadButton);
                });
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>
</body>

</html>
