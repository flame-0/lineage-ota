<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>lineage-ota</title>
        <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200" rel="stylesheet">

        <style>
            :root {
                --md-sys-color-background: #121212;
                --md-sys-color-surface: #1e1e1e;
                --md-sys-color-surface-variant: #2a2a2a;
                --md-sys-color-primary: #d0bcff;
                --md-sys-color-on-primary: #381e72;
                --md-sys-color-on-background: #e0e0e0;
                --md-sys-color-on-surface: #e0e0e0;
                --md-sys-elevation-1: 0px 1px 2px rgba(0,0,0,0.3), 0px 1px 3px 1px rgba(0,0,0,0.15);
                --md-sys-elevation-2: 0px 4px 8px 3px rgba(0,0,0,0.15), 0px 1px 3px rgba(0,0,0,0.3);
                --md-sys-shape-corner-large: 24px;
                --md-sys-shape-corner-medium: 12px;
                --md-sys-shape-corner-small: 8px;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Google Sans', sans-serif;
            }

            body {
                background-color: var(--md-sys-color-background);
                color: var(--md-sys-color-on-background);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 16px;
                gap: 16px;
            }

            main.container {
                width: 100%;
                max-width: 500px;
                margin: 0 auto;
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 16px;
                justify-items: stretch;
                align-items: start;
            }

            main.container.single-device {
                max-width: 500px;
                grid-template-columns: minmax(0, 500px);
            }

            .device-card {
                background-color: var(--md-sys-color-surface);
                border-radius: var(--md-sys-shape-corner-large);
                box-shadow: var(--md-sys-elevation-2);
                padding: 12px;
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 12px;
                min-width: 0;
            }

            .device-title {
                font-size: 20px;
                font-weight: 700;
                color: var(--md-sys-color-on-surface);
                text-align: center;
            }

            .device-subtitle {
                font-size: 14px;
                font-weight: 400;
                color: var(--md-sys-color-on-surface);
                opacity: 0.7;
                text-align: center;
                margin-top: 4px;
            }

            .download-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }

            .download-button {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 16px;
                background-color: var(--md-sys-color-surface-variant);
                border-radius: var(--md-sys-shape-corner-medium);
                text-decoration: none;
                color: var(--md-sys-color-on-surface);
                transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
                cursor: pointer;
                border: none;
                width: 100%;
                text-align: left;
                box-shadow: var(--md-sys-elevation-1);
                min-height: 48px;
                min-width: 0;
            }

            .download-button:hover {
                background-color: #3a3a3a;
                box-shadow: var(--md-sys-elevation-2);
            }

            .download-button:active {
                transform: scale(0.98);
            }

            .download-button:focus-visible {
                outline: 2px solid var(--md-sys-color-primary);
                outline-offset: 2px;
            }

            .download-button.primary {
                background-color: var(--md-sys-color-primary);
                color: var(--md-sys-color-on-primary);
            }

            .download-button.primary:hover {
                background-color: #e0c8ff;
            }

            .download-icon {
                font-family: 'Material Symbols Rounded';
                font-size: 24px;
                color: inherit;
                flex-shrink: 0;
            }

            .download-filename {
                font-size: 14px;
                font-weight: 500;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1;
                min-width: 0;
            }

            .file-meta {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-left: auto;
                flex-shrink: 0;
            }

            .file-badge {
                font-size: 12px;
                font-weight: 600;
                padding: 4px 8px;
                border-radius: var(--md-sys-shape-corner-small);
                background-color: rgba(255,255,255,0.1);
                color: inherit;
                text-transform: lowercase;
                letter-spacing: 0.5px;
                min-width: 40px;
                text-align: center;
            }

            .primary .file-badge {
                background-color: rgba(0,0,0,0.3);
                color: #ffffff;
            }

            .file-size {
                font-size: 12px;
                font-weight: 400;
                color: inherit;
                opacity: 0.7;
                white-space: nowrap;
            }

            .device-footer {
                text-align: center;
                font-size: 12px;
                font-weight: 500;
            }

            .device-footer a {
                color: var(--md-sys-color-primary);
                text-decoration: underline;
                text-underline-offset: 2px;
                transition: opacity 0.2s;
            }

            .device-footer a:hover {
                opacity: 0.8;
            }

            .state-message {
                text-align: center;
                color: var(--md-sys-color-on-background);
                opacity: 0.8;
                font-size: 16px;
                padding: 32px 0;
                grid-column: 1 / -1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            .loading-spinner {
                width: 48px;
                height: 48px;
                border: 4px solid rgba(255,255,255,0.2);
                border-top-color: var(--md-sys-color-primary);
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .retry-button {
                background-color: var(--md-sys-color-surface-variant);
                color: var(--md-sys-color-on-surface);
                border: none;
                padding: 10px 20px;
                border-radius: var(--md-sys-shape-corner-medium);
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                transition: background-color 0.2s;
                box-shadow: var(--md-sys-elevation-1);
            }

            .retry-button:hover {
                background-color: #3a3a3a;
            }

            @media (min-width: 768px) {
                main.container {
                    max-width: 800px;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }

                main.container.single-device {
                    max-width: 500px;
                    grid-template-columns: minmax(0, 500px);
                }

                .device-title {
                    font-size: 24px;
                }
            }
        </style>
    </head>

    <body>
        <main class="container" id="buildsContainer">
            <div class="state-message">
                <div class="loading-spinner"></div>
                <span>loading builds…</span>
            </div>
        </main>

        <script>
            const indexJsonUrl = 'index.json';
            const projectName = 'lineage-ota';

            function isUsefulAsset(filename) {
                return !filename.endsWith('.sha256sum') && filename !== 'sha256sum.txt' && /\.(zip|img)$/i.test(filename);
            }

            function getFileType(filename) {
                return filename.endsWith('.zip') ? 'zip' : 'img';
            }

            function getIconName(fileType) {
                return fileType === 'zip' ? 'archive' : 'image';
            }

            function formatSize(sizeInBytes) {
                if (!sizeInBytes) return '';
                const units = ['b', 'kb', 'mb', 'gb'];
                let size = sizeInBytes;
                let unitIndex = 0;
                while (size >= 1024 && unitIndex < units.length - 1) {
                    size /= 1024;
                    unitIndex++;
                }
                return `${size.toFixed(unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
            }

            function createDownloadButton(file, isPrimary = false) {
                const button = document.createElement('a');
                button.href = file.url;
                button.className = 'download-button';
                if (isPrimary) button.classList.add('primary');
                button.target = '_blank';
                button.rel = 'noopener noreferrer';

                const fileType = getFileType(file.filename);
                const iconName = getIconName(fileType);

                const icon = document.createElement('span');
                icon.className = 'download-icon material-symbols-rounded';
                icon.textContent = iconName;

                const filename = document.createElement('span');
                filename.className = 'download-filename';
                filename.textContent = file.filename;

                const meta = document.createElement('div');
                meta.className = 'file-meta';

                const size = document.createElement('span');
                size.className = 'file-size';
                size.textContent = formatSize(file.size);

                const badge = document.createElement('span');
                badge.className = 'file-badge';
                badge.textContent = fileType;

                meta.appendChild(size);
                meta.appendChild(badge);

                button.appendChild(icon);
                button.appendChild(filename);
                button.appendChild(meta);
                return button;
            }

            function renderDevice(deviceInfo) {
                const card = document.createElement('section');
                card.className = 'device-card';

                const title = document.createElement('h2');
                title.className = 'device-title';
                title.textContent = `${deviceInfo.device} ${deviceInfo.date}`;

                const subtitle = document.createElement('p');
                subtitle.className = 'device-subtitle';
                subtitle.textContent = `${deviceInfo.type || 'unknown'} · ${deviceInfo.version || 'unknown'}`;

                card.appendChild(title);
                card.appendChild(subtitle);

                const files = deviceInfo.files.filter(file => isUsefulAsset(file.filename));
                const list = document.createElement('div');
                list.className = 'download-list';

                if (files.length === 0) {
                    const emptyMessage = document.createElement('div');
                    emptyMessage.className = 'state-message';
                    emptyMessage.textContent = 'no downloadable files';
                    list.appendChild(emptyMessage);
                } else {
                    files.sort((firstFile, secondFile) => {
                        const firstFileIsZip = firstFile.filename.endsWith('.zip');
                        const secondFileIsZip = secondFile.filename.endsWith('.zip');
                        if (firstFileIsZip !== secondFileIsZip) {
                            return firstFileIsZip ? -1 : 1;
                        }
                        return firstFile.filename.localeCompare(secondFile.filename);
                    });

                    files.forEach((file, index) => {
                        const isPrimary = index === 0 && file.filename.endsWith('.zip');
                        list.appendChild(createDownloadButton(file, isPrimary));
                    });
                }

                card.appendChild(list);

                const footer = document.createElement('div');
                footer.className = 'device-footer';
                const link = document.createElement('a');
                link.href = `https://sourceforge.net/projects/${projectName}/files/${deviceInfo.device}/`;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = 'see previous versions';
                footer.appendChild(link);
                card.appendChild(footer);

                return card;
            }

            function renderAll(devices) {
                const container = document.getElementById('buildsContainer');
                container.innerHTML = '';
                container.classList.toggle('single-device', devices.length === 1);
                devices.sort((firstDevice, secondDevice) => firstDevice.device.localeCompare(secondDevice.device));
                devices.forEach(device => container.appendChild(renderDevice(device)));
            }

            function showLoading() {
                const container = document.getElementById('buildsContainer');
                container.innerHTML = `
                    <div class="state-message">
                        <div class="loading-spinner"></div>
                        <span>loading builds…</span>
                    </div>
                `;
            }

            function showError(message) {
                const container = document.getElementById('buildsContainer');
                container.innerHTML = `
                    <div class="state-message">
                        <span>${message}</span>
                        <button class="retry-button" onclick="location.reload()">
                            <span class="material-symbols-rounded">refresh</span>
                            retry
                        </button>
                    </div>
                `;
            }

            showLoading();

            fetch(indexJsonUrl)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .then(devices => {
                    renderAll(devices);
                })
                .catch(error => {
                    console.error('error fetching index:', error);
                    showError('failed to load builds');
                });
        </script>
    </body>
</html>
